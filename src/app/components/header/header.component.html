<!-- Header fijo horizontal profesional -->
<header class="header" [class.scrolled]="isScrolled">
  <div class="header-container">

    <!-- Logo y nombre - Lado izquierdo -->
    <div class="header-brand" (click)="navigateToRoute('/home')">
      <div class="brand-logo">
        <ion-icon name="code-slash" class="brand-icon"></ion-icon>
      </div>
      <div class="brand-text">
        <!-- NOMBRE igual que en el CV -->
        <span class="brand-name">Alejandro Villa Villavicencio</span>
        <!-- TITULAR ALINEADO CON LOS 3 CV (variante corta: el header tiene poco espacio horizontal) -->
        <span class="brand-title">
          Soporte de Aplicaciones · Desarrollo · Datos
        </span>
      </div>
    </div>

    <!-- Navegación desktop - Centro -->
    <nav class="header-nav desktop-nav" aria-label="Navegación principal">
      <ul class="nav-list">
        <li class="nav-item" *ngFor="let item of navItems">
          <button
            class="nav-link"
            [class.active]="isActiveRoute(item.route)"
            (click)="navigateToRoute(item.route)"
            type="button"
          >
            <ion-icon [name]="item.icon" class="nav-icon"></ion-icon>
            <span class="nav-label">{{ item.label }}</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Controles de header - Lado derecho -->
    <div class="header-controls">

      <!-- Toggle de tema -->
      <button
        class="theme-toggle"
        (click)="toggleTheme()"
        type="button"
        [attr.aria-label]="isDarkMode() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      >
        <ion-icon
          [name]="isDarkMode() ? 'sunny' : 'moon'"
          class="theme-icon"
        ></ion-icon>
      </button>

      <!-- Botón menú móvil -->
      <button
        class="mobile-menu-toggle"
        (click)="toggleMobileMenu()"
        [class.active]="mobileMenuOpen"
        type="button"
        aria-label="Abrir menú de navegación"
      >
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </div>

  <!-- Menú móvil - DROPDOWN DESDE ARRIBA -->
  <div
    class="mobile-nav-dropdown"
    [class.open]="mobileMenuOpen"
    [attr.aria-hidden]="!mobileMenuOpen"
  >
    <!-- Lista de navegación móvil -->
    <ul class="mobile-nav-list">
      <li class="mobile-nav-item" *ngFor="let item of navItems">
        <button
          class="mobile-nav-link"
          [class.active]="isActiveRoute(item.route)"
          (click)="navigateToRoute(item.route)"
          type="button"
        >
          <ion-icon [name]="item.icon" class="mobile-nav-icon"></ion-icon>
          <span class="mobile-nav-label">{{ item.label }}</span>
        </button>
      </li>
    </ul>

    <!-- Toggle de tema en el menú -->
    <div class="mobile-theme-section">
      <button
        class="mobile-theme-toggle"
        (click)="toggleTheme()"
        type="button"
      >
        <ion-icon
          [name]="isDarkMode() ? 'sunny' : 'moon'"
          class="mobile-theme-icon"
        ></ion-icon>
        <span class="mobile-theme-label">
          {{ isDarkMode() ? 'Tema claro' : 'Tema oscuro' }}
        </span>
      </button>
    </div>
  </div>
</header>
